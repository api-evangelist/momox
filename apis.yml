aid: momox
name: Momox
description: >-
  momox SE (formerly Momox AG / Momox GmbH) is a Berlin-based re-commerce company
  founded by Christian Wegner in 2004 — the name stands for "Moderner Medien Online
  Express-Ankauf" (Modern Media Online Express Purchase). Through momox.de it buys
  used books, CDs, DVDs/Blu-rays and games from private sellers at fixed prices in
  Germany, Austria, France, Belgium and the UK, reselling them via its Medimops shop
  and third-party marketplaces. Its momox fashion arm (formerly ubup.com,
  momoxfashion.com) does the same for second-hand clothing, shoes and accessories.
  momox runs large logistics centres in Berlin, Leipzig and Neuenhagen bei Berlin and
  has handled more than 350 million articles since founding. momox is a consumer-facing
  re-commerce operation; it publishes no official public developer program, API portal,
  or SDKs. The only machine surface is an internal, undocumented mobile-app pricing
  endpoint (api.momox.de / api.momox.fr) that is not offered as a first-party API.
